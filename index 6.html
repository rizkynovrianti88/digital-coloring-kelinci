<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎨 Dunia Mewarnai</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fff7fb,#f4f0ff);color:#29243a}header{text-align:center;padding:25px 15px 10px}h1{margin:0;font-size:30px}p{color:#706a79}.home,.game{max-width:560px;margin:auto;padding:12px 18px 35px}.hero,.artbox{background:#fff;border-radius:28px;padding:24px 18px;text-align:center;box-shadow:0 8px 30px #0001}.bunny{font-size:105px}.start{width:100%;border:0;border-radius:18px;padding:16px;font-size:19px;font-weight:700;background:#7c5cff;color:white}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{background:white;border-radius:20px;padding:16px;text-align:center}.card div{font-size:45px}.back{border:0;background:white;border-radius:14px;padding:11px 16px;font-size:16px;margin-bottom:10px}.hidden{display:none}svg{width:100%;display:block}.p{stroke:#292929;stroke-width:5;fill:#fff;cursor:pointer}.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:15px 0}.c{width:43px;height:43px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px #999}.selected{outline:3px solid #292929;outline-offset:2px}.tools{display:flex;gap:9px}.tools button{flex:1;border:0;border-radius:14px;padding:13px 6px;background:white;font-size:16px}
</style></head><body>
<header><h1>🎨 Dunia Mewarnai</h1><p>Coloring book seru untuk dimainkan di HP</p></header>
<section id="home" class="home"><div class="hero"><div class="bunny">🐰</div><h2>Ayo Mewarnai!</h2><p>Pilih gambar favoritmu dan warnai dengan menyentuh bagian gambarnya.</p><button class="start" onclick="start()">🌈 Mulai Mewarnai</button></div><div class="cards"><div class="card"><div>🐰</div><b>Kelinci</b></div><div class="card"><div>⭐</div><b>Segera Hadir</b></div></div></section>
<section id="game" class="game hidden"><button class="back" onclick="backHome()">← Kembali</button><div class="artbox">
<svg id="art" viewBox="0 0 600 760"><rect width="600" height="760" fill="white"/>
<path class="p" d="M205 235C165 180 150 75 195 45c40-27 65 47 63 160z"/><path class="p" d="M395 235c40-55 55-160 10-190-40-27-65 47-63 160z"/><ellipse class="p" cx="300" cy="285" rx="150" ry="130"/><path class="p" d="M205 390c-20 40-30 145 0 220 20 55 170 55 190 0 30-75 20-180 0-220-35 30-155 30-190 0z"/><path class="p" d="M220 425c25 25 135 25 160 0l18 110c-48 25-148 25-196 0z"/><ellipse class="p" cx="235" cy="635" rx="65" ry="42"/><ellipse class="p" cx="365" cy="635" rx="65" ry="42"/><ellipse class="p" cx="190" cy="485" rx="34" ry="65" transform="rotate(18 190 485)"/><ellipse class="p" cx="410" cy="485" rx="34" ry="65" transform="rotate(-18 410 485)"/><ellipse class="p" cx="250" cy="275" rx="18" ry="25"/><ellipse class="p" cx="350" cy="275" rx="18" ry="25"/><circle class="p" cx="230" cy="325" r="22"/><circle class="p" cx="370" cy="325" r="22"/><path d="M285 315q15-10 30 0q-15 20-30 0M300 335q-25 25-50 10M300 335q25 25 50 10" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/><path d="M275 470h50v45h-50z" fill="none" stroke="#222" stroke-width="5"/></svg>
<p>Pilih warna, lalu tap bagian kelinci 🐰</p><div id="colors" class="palette"></div><div class="tools"><button onclick="undo()">↩️ Undo</button><button onclick="reset()">🔄 Reset</button><button onclick="save()">💾 Simpan</button></div></div></section>
<script>
let col="#ff4d6d",hist=[];const cs=["#ff4d6d","#ff9f1c","#ffd43b","#69db7c","#4dabf7","#845ef7","#b197fc","#9c6644","#fff"],box=document.getElementById("colors");
cs.forEach((x,i)=>{let b=document.createElement("span");b.className="c"+(i?"":" selected");b.style.background=x;b.onclick=()=>{col=x;document.querySelectorAll(".c").forEach(z=>z.classList.remove("selected"));b.classList.add("selected")};box.appendChild(b)});
document.querySelectorAll(".p").forEach(e=>e.onclick=()=>{hist.push([e,e.style.fill]);e.style.fill=col});
function start(){home.classList.add("hidden");game.classList.remove("hidden");scrollTo(0,0)}function backHome(){game.classList.add("hidden");home.classList.remove("hidden");scrollTo(0,0)}function undo(){let x=hist.pop();if(x)x[0].style.fill=x[1]}function reset(){document.querySelectorAll(".p").forEach(e=>e.style.fill="#fff");hist=[]}function save(){let s=new XMLSerializer().serializeToString(art);let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"image/svg+xml"}));a.download="hasil-mewarnai.svg";a.click()}
</script></body></html>
