<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎨 Mewarnai Kelinci</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f7f4ff;color:#222;text-align:center}
header{padding:16px 12px 8px}
h1{font-size:22px;margin:0 0 5px}
p{margin:0;font-size:14px;color:#666}
.card{width:min(94vw,520px);margin:10px auto;background:white;border-radius:22px;padding:10px;box-shadow:0 4px 20px #00000012}
svg{display:block;width:100%;height:auto;background:#fff;border-radius:16px}
.part{fill:#fff;stroke:#222;stroke-width:5;stroke-linejoin:round;cursor:pointer}
.detail{fill:none;stroke:#222;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:12px 6px}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px #999;cursor:pointer}
.swatch.active{outline:3px solid #222;outline-offset:2px}
.actions{display:flex;gap:8px;justify-content:center;padding:4px 0 12px}
button{border:0;background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 2px 7px #0001}
#status{font-size:13px;color:#666;min-height:18px}
</style>
</head>
<body>
<header>
<h1>🎨 Ayo Mewarnai Kelinci!</h1>
<p>Pilih warna, lalu tap bagian kelinci.</p>
</header>

<div class="card">
<svg id="art" viewBox="0 0 600 760" aria-label="Gambar kelinci untuk diwarnai">
  <rect x="0" y="0" width="600" height="760" rx="20" fill="#fff"/>
  <!-- ears -->
  <path class="part" data-name="Telinga kiri" d="M205 235 C165 180 150 75 195 45 C235 18 260 92 258 205 Z"/>
  <path class="part" data-name="Telinga kanan" d="M395 235 C435 180 450 75 405 45 C365 18 340 92 342 205 Z"/>
  <!-- head -->
  <ellipse class="part" data-name="Kepala" cx="300" cy="285" rx="150" ry="130"/>
  <!-- body -->
  <path class="part" data-name="Badan" d="M205 390 C185 430 175 535 205 610 C225 665 375 665 395 610 C425 535 415 430 395 390 C360 420 240 420 205 390 Z"/>
  <!-- shirt -->
  <path class="part" data-name="Baju" d="M220 425 C245 450 355 450 380 425 L398 535 C350 560 250 560 202 535 Z"/>
  <!-- feet -->
  <ellipse class="part" data-name="Kaki kiri" cx="235" cy="635" rx="65" ry="42"/>
  <ellipse class="part" data-name="Kaki kanan" cx="365" cy="635" rx="65" ry="42"/>
  <!-- arms -->
  <ellipse class="part" data-name="Tangan kiri" cx="190" cy="485" rx="34" ry="65" transform="rotate(18 190 485)"/>
  <ellipse class="part" data-name="Tangan kanan" cx="410" cy="485" rx="34" ry="65" transform="rotate(-18 410 485)"/>
  <!-- face details -->
  <ellipse class="part" data-name="Mata kiri" cx="250" cy="275" rx="18" ry="25"/>
  <ellipse class="part" data-name="Mata kanan" cx="350" cy="275" rx="18" ry="25"/>
  <circle class="part" data-name="Pipi kiri" cx="230" cy="325" r="22"/>
  <circle class="part" data-name="Pipi kanan" cx="370" cy="325" r="22"/>
  <path class="detail" d="M285 315 Q300 305 315 315 Q300 335 285 315 Z"/>
  <path class="detail" d="M300 335 Q275 360 250 345 M300 335 Q325 360 350 345"/>
  <circle cx="245" cy="270" r="5" fill="#222"/>
  <circle cx="345" cy="270" r="5" fill="#222"/>
  <!-- shirt pocket -->
  <path class="detail" d="M275 470 L325 470 L325 515 L275 515 Z"/>
  <circle cx="300" cy="493" r="5" fill="#222"/>
</svg>

<div id="status">Warna terpilih: pink</div>
<div class="palette" id="palette"></div>
<div class="actions">
<button id="undo">↩️ Undo</button>
<button id="reset">🔄 Reset</button>
<button id="save">💾 Simpan</button>
</div>
</div>

<script>
const colors=[
["#ff6b81","Pink"],["#ff9f1c","Oranye"],["#ffd43b","Kuning"],
["#69db7c","Hijau"],["#4dabf7","Biru"],["#845ef7","Ungu"],
["#b197fc","Lavender"],["#9c6644","Cokelat"],["#ffffff","Putih"]
];
let selected=colors[0][0], history=[];
const status=document.getElementById("status"), palette=document.getElementById("palette");

colors.forEach(([c,n],i)=>{
 const b=document.createElement("button"); b.className="swatch"+(i===0?" active":"");
 b.style.background=c; b.title=n; b.setAttribute("aria-label",n);
 b.onclick=()=>{selected=c;status.textContent="Warna terpilih: "+n;
 document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("active"));b.classList.add("active")};
 palette.appendChild(b);
});

document.querySelectorAll(".part").forEach(el=>{
 el.addEventListener("pointerdown",e=>{
   e.preventDefault();
   history.push({el,color:el.style.fill||""});
   el.style.fill=selected;
   status.textContent="Bagian "+el.dataset.name+" sudah diwarnai ✨";
 });
});

document.getElementById("undo").onclick=()=>{
 const x=history.pop(); if(x){x.el.style.fill=x.color;status.textContent="Satu langkah dibatalkan."}
};
document.getElementById("reset").onclick=()=>{
 document.querySelectorAll(".part").forEach(el=>el.style.fill="#fff");
 history=[];status.textContent="Gambar kembali seperti semula.";
};
document.getElementById("save").onclick=()=>{
 const svg=document.getElementById("art").cloneNode(true);
 svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
 svg.querySelectorAll(".part").forEach(el=>{el.style.cursor="default"});
 const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:"image/svg+xml"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="hasil-mewarnai-kelinci.svg";a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 status.textContent="Hasil sudah disiapkan untuk disimpan.";
};
</script>
</body>
</html>
